<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>125code</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0F1117;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #4F6AF5, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 16px;
      color: #6B7280;
      margin-bottom: 64px;
      letter-spacing: 1px;
    }

    .apps-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #4B5563;
      margin-bottom: 24px;
    }

    .apps {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 420px;
    }

    .app-card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #1A1D27;
      border: 1px solid #2D3148;
      border-radius: 16px;
      padding: 20px 24px;
      text-decoration: none;
      color: #fff;
      transition: border-color 0.2s, transform 0.2s;
    }

    .app-card:hover {
      border-color: #4F6AF5;
      transform: translateY(-2px);
    }

    .app-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4F6AF5, #8B5CF6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .app-info { flex: 1; }

    .app-name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .app-desc {
      font-size: 13px;
      color: #6B7280;
    }

    .app-arrow {
      font-size: 18px;
      color: #4B5563;
    }

    .footer {
      margin-top: 64px;
      font-size: 12px;
      color: #374151;
    }
  </style>
</head>
<body>

  <div class="logo">125code</div>
  <div class="tagline">Cardim Group DWC-LLC</div>

  <div class="apps-title">האפליקציות שלנו</div>

  <div class="apps">
    <a class="app-card" href="https://alai.125code.com" target="_blank">
      <div class="app-icon">📋</div>
      <div class="app-info">
        <div class="app-name">עליי — Alai</div>
        <div class="app-desc">מערכת ניהול משימות פנימית</div>
      </div>
      <div class="app-arrow">←</div>
    </a>
  </div>

  <div class="footer">© 2026 125code · Cardim Group DWC-LLC</div>

</body>
</html>
